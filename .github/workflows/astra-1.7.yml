name: astra/1.7

on:
  push:
    branches:
      - '**'
    paths:
      - astra/1.7/**
  pull_request:
    paths:
      - astra/1.7/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    # A pull request from a branch of this repository is skipped: the push
    # to that branch builds the same changes.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/image.yml
    with:
      dir: astra/1.7
      tag: astra-1.7
      skip_arm64: true
    secrets: inherit
