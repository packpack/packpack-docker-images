name: opensuse/leap/15.1

on:
  push:
    branches:
      - '**'
    paths:
      - opensuse/leap/15.1/**
  pull_request:
    paths:
      - opensuse/leap/15.1/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    # A pull request from a branch of this repository is skipped: the push
    # to that branch builds the same changes.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/image.yml
    with:
      dir: opensuse/leap/15.1
      tag: opensuse-leap-15.1
    secrets: inherit
